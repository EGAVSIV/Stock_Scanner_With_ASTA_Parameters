name: Fetch Stock Data

on:
  schedule:
    # All times below are UTC (IST = UTC + 5:30)
    - cron: "0 4 * * 1-5"    # 09:30 IST
    - cron: "30 4 * * 1-5"   # 10:00 IST
    - cron: "0 5 * * 1-5"    # 10:30 IST
    - cron: "30 5 * * 1-5"   # 11:00 IST
    - cron: "0 6 * * 1-5"    # 11:30 IST
    - cron: "30 6 * * 1-5"   # 12:00 IST
    - cron: "0 7 * * 1-5"    # 12:30 IST
    - cron: "30 7 * * 1-5"   # 01:00 IST
    - cron: "0 8 * * 1-5"    # 01:30 IST
    - cron: "30 8 * * 1-5"   # 02:00 IST
    - cron: "0 9 * * 1-5"    # 02:30 IST
    - cron: "30 9 * * 1-5"   # 03:00 IST
    - cron: "0 10 * * 1-5"   # 03:30 IST
    - cron: "30 10 * * 1-5"  # 04:00 IST

  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    # 🚦 Prevent overlapping executions
    concurrency:
      group: stock-data-fetch
      cancel-in-progress: false

    permissions:
      contents: write

    steps:

      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # ==========================================
      # DELETE OLD RUNTIME LOG FILES
      # ==========================================
      - name: Delete existing runtime logs
        run: |
          echo "Removing old runtime log files..."

          rm -f download_log.txt
          rm -f error_symbols.txt

          echo "Runtime logs removed."

      # ==========================================
      # SETUP PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tradingview-datafeed pandas numpy pyarrow requests openpyxl scipy matplotlib

      # ==========================================
      # RUN DATA FETCH
      # ==========================================
      - name: Run data fetch
        run: |
          python "All_Data_Fetch.py"

      # ==========================================
      # DELETE LOGS CREATED DURING DATA FETCH
      # ==========================================
      - name: Delete runtime logs after fetch
        if: always()
        run: |
          echo "Removing runtime logs created by All_Data_Fetch.py..."

          rm -f download_log.txt
          rm -f error_symbols.txt

          echo "Runtime logs removed."

      # ==========================================
      # SHOW FILES THAT WILL BE COMMITTED
      # ==========================================
      - name: Check Git changes
        run: |
          echo "Git status before commit:"
          git status --short

      # ==========================================
      # COMMIT & PUSH STOCK DATA ONLY
      # ==========================================
      - name: Commit & Push data safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Adding ONLY stock data folders..."

          git add stock_data_*

          echo "Files staged for commit:"
          git diff --cached --name-only

          git commit -m "Auto update stock data ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes to commit"

          # Sync with remote to avoid push rejection
          git pull --rebase origin main || echo "Nothing to rebase"

          git push origin main
