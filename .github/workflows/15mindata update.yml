name: Fetch 15M Stock Data

on:
  schedule:
    # Every hour at :00 UTC (09:30, 11:30, 13:30, 15:30 and 16:30 IST)
    - cron: "0 4-11 * * 1-5"

    # Every hour at :30 UTC (10:00, 12:00, 14:00 and 16:00 IST)
    - cron: "30 4-10 * * 1-5"

  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    concurrency:
      group: stock-data-fetch-15m
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      # ==============================
      # Checkout Repository
      # ==============================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ==============================
      # CRITICAL: Remove oversized runtime files from ALL Git history
      # ==============================
      - name: Clean large runtime files from Git history
        run: |
          python -m pip install --upgrade git-filter-repo
          git filter-repo --force --path download_log.txt --path error_symbols.txt --invert-paths

      # ==============================
      # Setup Python + Enable Cache
      # ==============================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      # ==============================
      # Install Dependencies
      # ==============================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==============================
      # Run Your 15M Script
      # ==============================
      - name: Run 15M Data Fetch
        run: |
          python Datafetch15M.py

      # ==============================
      # Save logs as workflow artifacts, NOT Git files
      # ==============================
      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 15m-fetch-logs-${{ github.run_number }}
          path: |
            download_log.txt
            error_symbols.txt
          if-no-files-found: ignore
          retention-days: 7

      # ==============================
      # Remove runtime files before commit
      # ==============================
      - name: Remove runtime logs
        run: |
          rm -f download_log.txt error_symbols.txt

      # ==============================
      # Commit & Push data safely
      # ==============================
      - name: Commit & Push data safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A stock_data_15
          git add -A .gitignore
          git commit -m "Auto update 15M data ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes to commit"

          git push --force-with-lease origin main
