name: Fetch 15M Stock Data

on:
  schedule:
    # 09:15–09:55 IST (03:45–03:55 UTC)
    - cron: "45-59/5 3 * * 1-5"

    # 10:00–14:55 IST (04:00–09:55 UTC)
    - cron: "*/5 4-9 * * 1-5"

    # 15:00–15:30 IST (10:00 UTC)
    - cron: "0 10 * * 1-5"

  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    concurrency:
      group: stock-data-fetch-15m
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      # ==============================
      # Checkout Repository
      # ==============================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ==============================
      # Setup Python + Enable Cache
      # ==============================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      # ==============================
      # Install Dependencies
      # ==============================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==============================
      # Run Your 15M Script
      # ==============================
      - name: Run 15M Data Fetch
        run: |
          python Datafetch15M.py

      # ==============================
      # Commit & Push Changes
      # ==============================
      - name: Commit & Push data safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add stock_data_15 download_log.txt error_symbols.txt
          git commit -m "Auto update 15M data ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes to commit"

          git pull --rebase origin main || echo "Nothing to rebase"

          git push origin main
