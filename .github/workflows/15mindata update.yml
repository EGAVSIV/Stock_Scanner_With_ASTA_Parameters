name: Fetch 15M Stock Data

on:
  schedule:
    # Every hour at :00 UTC (09:30, 11:30, 13:30, 15:30 IST and 16:30 IST)
    - cron: "0 4-11 * * 1-5"

    # Every hour at :30 UTC (10:00, 12:00, 14:00, 16:00 IST)
    - cron: "30 4-10 * * 1-5"

  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    concurrency:
      group: stock-data-fetch-15m
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      # ==============================
      # Checkout Repository
      # ==============================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ==============================
      # Setup Python + Enable Cache
      # ==============================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      # ==============================
      # Install Dependencies
      # ==============================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==============================
      # Run Your 15M Script
      # ==============================
      - name: Run 15M Data Fetch
        run: |
          python Datafetch15M.py

      # ==============================
      # Keep runtime logs out of Git
      # ==============================
      - name: Remove runtime logs from Git worktree
        run: |
          rm -f download_log.txt error_symbols.txt

      # ==============================
      # Commit & Push data safely
      # ==============================
      - name: Commit & Push data safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add stock_data_15
          git commit -m "Auto update 15M data ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes to commit"

          git pull --rebase origin main || echo "Nothing to rebase"

          git push origin main
