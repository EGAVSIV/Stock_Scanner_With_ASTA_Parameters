name: Run 15M Data Fetch

on:
  schedule:
    # 03:45–03:55 UTC (first hour partial)
    - cron: '45-59/5 3 * * 1-5'

    # 04:00–09:55 UTC
    - cron: '*/5 4-9 * * 1-5'

    # 10:00 UTC (last run = 3:30 PM IST)
    - cron: '0 10 * * 1-5'

  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install tvdatafeed pandas pyarrow

      - name: Run 15M Data Fetch Script
        run: |
          python Datafetch15M.py
