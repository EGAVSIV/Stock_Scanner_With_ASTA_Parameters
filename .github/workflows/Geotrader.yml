name: Fetch stock data

on:
  schedule:
    # UTC Time (IST = UTC + 5:30)
    - cron: "0 4 * * 1-5"
    - cron: "30 4 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 9 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "30 10 * * 1-5"

  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    # 🚦 Prevent overlapping executions
    concurrency:
      group: stock-data-fetch
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tradingview-datafeed pandas numpy pyarrow requests openpyxl scipy matplotlib

      - name: Run Geo Trader Data Fetch
        run: |
          python "Geo_trader_data_Feth.py"

      - name: Commit & Push changes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add stock_data_* download_log.txt error_symbols.txt market_data/

          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || \
          git commit -m "Auto update stock data ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"

          # Rebase to avoid push rejection
          git pull --rebase origin main || echo "Nothing to rebase"

          git push origin main
